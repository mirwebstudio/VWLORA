<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="VELORA — Fashion. Without Boundaries. Modern fashion for a modern life.">
<title>VELORA — Fashion. Without Boundaries.</title>
<script>
  // Global image fallback so images never break
  window.__VELORA_FALLBACK__ = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800"><rect fill="#f5f5f5" width="100%" height="100%"/><text x="50%" y="48%" text-anchor="middle" fill="#767676" font-family="Helvetica,Arial,sans-serif" font-size="32" letter-spacing="8">VELORA</text><text x="50%" y="54%" text-anchor="middle" fill="#aaaaaa" font-family="Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2">COMING SOON</text></svg>'
  );
  window.__imgErr = function(img){ img.onerror = null; img.src = window.__VELORA_FALLBACK__; };
</script>
<style>
  /* ============ RESET & TOKENS ============ */
  :root{
    --ink:#111111; --white:#FFFFFF; --soft:#F5F5F5; --muted:#767676;
    --line:#E5E5E5; --sale:#D6001C; --success:#15803D; --danger:#DC2626;
    --max:1600px; --pad:16px;
  }
  @media (min-width:768px){ :root{ --pad:24px; } }
  @media (min-width:1024px){ :root{ --pad:32px; } }

  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:var(--white); color:var(--ink);
    font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  body{ line-height:1.5; font-size:14px; }
  a{ color:inherit; text-decoration:none; }
  img{ max-width:100%; display:block; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; font-size:inherit; }
  input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  ul,ol{ list-style:none; }
  table{ border-collapse:collapse; width:100%; }
  h1,h2,h3,h4{ font-weight:500; letter-spacing:-0.01em; line-height:1.15; }

  /* ============ LAYOUT ============ */
  .container{ max-width:var(--max); margin:0 auto; padding:0 var(--pad); }
  .grid-2{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .grid-3{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .grid-4{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  @media (min-width:640px){
    .grid-3{ grid-template-columns:repeat(3,1fr); }
    .grid-4{ grid-template-columns:repeat(3,1fr); }
  }
  @media (min-width:1024px){
    .grid-4{ grid-template-columns:repeat(4,1fr); }
  }
  .flex{ display:flex; } .items-center{ align-items:center; } .justify-between{ justify-content:space-between; }
  .gap-2{ gap:8px; } .gap-4{ gap:16px; } .gap-6{ gap:24px; }

  /* ============ TYPOGRAPHY ============ */
  .h-hero{ font-size:32px; line-height:1.1; }
  @media (min-width:768px){ .h-hero{ font-size:56px; } }
  .h-section{ font-size:22px; margin-bottom:24px; }
  @media (min-width:768px){ .h-section{ font-size:32px; } }
  .h-sub{ font-size:18px; }
  .text-muted{ color:var(--muted); }
  .text-sm{ font-size:13px; }
  .text-xs{ font-size:11px; }
  .uppercase{ text-transform:uppercase; }
  .tracking-widest{ letter-spacing:0.15em; }
  .tracking-wide{ letter-spacing:0.05em; }
  .line-through{ text-decoration:line-through; }
  .underline{ text-decoration:underline; text-underline-offset:3px; }

  /* ============ BUTTONS ============ */
  .btn{ display:inline-flex; align-items:center; justify-content:center;
    height:44px; padding:0 24px; font-size:12px; font-weight:500;
    letter-spacing:0.1em; text-transform:uppercase; transition:background 150ms, color 150ms, opacity 150ms;
    white-space:nowrap; }
  .btn:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .btn-primary{ background:var(--ink); color:var(--white); }
  .btn-primary:hover{ background:#333; }
  .btn-primary:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-secondary{ background:var(--white); color:var(--ink); border:1px solid var(--ink); }
  .btn-secondary:hover{ background:var(--soft); }
  .btn-ghost{ background:transparent; }
  .btn-ghost:hover{ background:var(--soft); }
  .btn-sm{ height:36px; padding:0 16px; font-size:11px; }
  .btn-icon{ width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center; }
  .btn-icon:hover{ background:var(--soft); }

  /* ============ FORM ============ */
  .input{ width:100%; height:44px; padding:0 12px; border:1px solid var(--line);
    background:#fff; outline:none; transition:border-color 150ms; }
  .input:focus{ border-color:var(--ink); }
  textarea.input{ height:auto; padding:12px; }
  select.input{ padding-right:32px; appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%23111' d='M6 8 0 0h12z'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center; }
  .label{ display:block; font-size:11px; text-transform:uppercase;
    letter-spacing:0.1em; color:var(--muted); margin-bottom:6px; }
  .field{ margin-bottom:14px; }
  .err{ color:var(--danger); font-size:12px; margin-top:4px; }

  /* ============ BADGES ============ */
  .badge{ display:inline-block; padding:2px 8px; font-size:10px;
    letter-spacing:0.1em; text-transform:uppercase; }
  .badge-new{ background:#fff; color:var(--ink); border:1px solid var(--ink); }
  .badge-sale{ background:var(--sale); color:#fff; }
  .badge-info{ background:var(--soft); color:var(--muted); }
  .badge-success{ background:#dcfce7; color:var(--success); }
  .badge-warn{ background:#fef3c7; color:#92400e; }
  .badge-danger{ background:#fee2e2; color:var(--danger); }

  /* ============ ANNOUNCEMENT BAR ============ */
  .announce{ background:var(--ink); color:#fff; font-size:11px;
    letter-spacing:0.15em; text-transform:uppercase; height:32px;
    display:flex; align-items:center; justify-content:center; padding:0 16px;
    text-align:center; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }

  /* ============ HEADER ============ */
  .header{ position:sticky; top:0; z-index:40; background:#fff;
    border-bottom:1px solid var(--line); }
  .header-main{ display:flex; align-items:center; justify-content:space-between;
    height:60px; position:relative; }
  .header-logo{ font-size:20px; letter-spacing:0.3em; font-weight:500;
    position:absolute; left:50%; transform:translateX(-50%); }
  .header-left, .header-right{ display:flex; align-items:center; gap:12px; }
  .header-icon{ width:38px; height:38px; display:inline-flex;
    align-items:center; justify-content:center; position:relative;
    transition:background 150ms; }
  .header-icon:hover{ background:var(--soft); }
  .cart-count{ position:absolute; top:2px; right:2px;
    background:var(--ink); color:#fff; font-size:10px; font-weight:600;
    min-width:16px; height:16px; padding:0 4px; border-radius:999px;
    display:inline-flex; align-items:center; justify-content:center; }

  .header-nav{ display:none; border-top:1px solid var(--line);
    justify-content:center; gap:32px; }
  @media (min-width:768px){ .header-nav{ display:flex; } }
  .header-nav a{ padding:12px 0; font-size:12px; letter-spacing:0.15em;
    text-transform:uppercase; transition:opacity 150ms; }
  .header-nav a:hover{ opacity:0.6; }

  /* Mega menu */
  .mega-wrap{ position:relative; }
  .mega-menu{ display:none; position:absolute; top:100%; left:0; right:0;
    background:#fff; border-top:1px solid var(--line); box-shadow:0 8px 24px rgba(0,0,0,0.06);
    z-index:30; }
  .mega-wrap:hover .mega-menu{ display:block; }
  .mega-menu-inner{ max-width:var(--max); margin:0 auto; padding:32px var(--pad);
    display:grid; grid-template-columns:3fr 1fr; gap:32px; }
  .mega-links{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px 16px; }
  .mega-links a{ font-size:13px; padding:6px 0; color:var(--muted); }
  .mega-links a:hover{ color:var(--ink); }
  .mega-feature img{ width:100%; aspect-ratio:3/4; object-fit:cover; }

  /* ============ SEARCH OVERLAY ============ */
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:60;
    display:none; }
  .overlay.open{ display:block; }
  .search-panel{ background:#fff; padding:24px 16px; }
  .search-input-wrap{ display:flex; align-items:center; gap:12px;
    border-bottom:1px solid var(--ink); padding-bottom:12px; }
  .search-input-wrap input{ flex:1; border:none; outline:none; font-size:18px; }

  /* ============ MOBILE MENU ============ */
  .drawer-left{ position:fixed; top:0; left:0; bottom:0; width:80%; max-width:340px;
    background:#fff; z-index:70; transform:translateX(-100%);
    transition:transform 250ms ease; display:flex; flex-direction:column; }
  .drawer-left.open{ transform:translateX(0); }
  .drawer-left-header{ display:flex; align-items:center; justify-content:space-between;
    padding:16px; border-bottom:1px solid var(--line); }
  .drawer-left nav{ padding:24px 16px; overflow-y:auto; }
  .drawer-left nav a{ display:block; padding:12px 0; font-size:13px;
    letter-spacing:0.1em; text-transform:uppercase; border-bottom:1px solid var(--soft); }

  /* ============ CART DRAWER ============ */
  .cart-drawer{ position:fixed; top:0; right:0; bottom:0; width:100%;
    max-width:420px; background:#fff; z-index:70; display:flex;
    flex-direction:column; transform:translateX(100%);
    transition:transform 250ms ease; box-shadow:-8px 0 24px rgba(0,0,0,0.1); }
  .cart-drawer.open{ transform:translateX(0); }
  .cart-drawer-header{ display:flex; align-items:center;
    justify-content:space-between; padding:16px; border-bottom:1px solid var(--line); }
  .cart-drawer-body{ flex:1; overflow-y:auto; }
  .cart-drawer-footer{ border-top:1px solid var(--line); padding:16px; }

  /* ============ PRODUCT CARD ============ */
  .product-card{ display:block; }
  .product-card-img{ position:relative; aspect-ratio:3/4; overflow:hidden;
    background:var(--soft); }
  .product-card-img img{ width:100%; height:100%; object-fit:cover;
    transition:transform 400ms ease; }
  .product-card:hover .product-card-img img{ transform:scale(1.03); }
  .product-card-badges{ position:absolute; top:8px; left:8px;
    display:flex; flex-direction:column; gap:4px; z-index:1; }
  .wishlist-btn{ position:absolute; top:8px; right:8px;
    background:rgba(255,255,255,0.9); width:32px; height:32px;
    border-radius:999px; display:flex; align-items:center;
    justify-content:center; z-index:1; transition:background 150ms; }
  .wishlist-btn:hover{ background:#fff; }
  .wishlist-btn.active{ color:var(--sale); }
  .product-card-info{ padding-top:10px; }
  .product-name{ font-size:13px; overflow:hidden;
    display:-webkit-box; -webkit-line-clamp:1;
    -webkit-box-orient:vertical; }
  .product-price{ font-size:13px; margin-top:4px;
    display:flex; align-items:baseline; gap:6px; }
  .product-price .old{ color:var(--muted); font-size:12px; }
  .color-swatches{ display:flex; gap:4px; margin-top:6px; }
  .swatch{ width:10px; height:10px; border-radius:50%;
    border:1px solid var(--line); }

  /* ============ PRODUCT DETAIL ============ */
  .pdp{ display:grid; grid-template-columns:1fr; gap:32px; }
  @media (min-width:768px){ .pdp{ grid-template-columns:1fr 1fr; gap:64px; } }
  .pdp-gallery-main{ aspect-ratio:3/4; background:var(--soft); overflow:hidden; }
  .pdp-gallery-main img{ width:100%; height:100%; object-fit:cover; }
  .pdp-thumbs{ display:flex; gap:8px; margin-top:8px; overflow-x:auto; }
  .pdp-thumb{ width:64px; height:80px; flex-shrink:0; background:var(--soft);
    overflow:hidden; border:1px solid transparent; cursor:pointer; }
  .pdp-thumb.active{ border-color:var(--ink); }
  .pdp-thumb img{ width:100%; height:100%; object-fit:cover; }
  .size-btn{ min-width:52px; height:40px; border:1px solid var(--line);
    font-size:13px; transition:all 150ms; }
  .size-btn:hover:not(:disabled){ border-color:var(--ink); }
  .size-btn.selected{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .size-btn:disabled{ opacity:0.3; text-decoration:line-through; cursor:not-allowed; }
  .color-btn{ width:32px; height:32px; border-radius:50%;
    border:1px solid var(--line); position:relative; transition:transform 150ms; }
  .color-btn.selected{ box-shadow:0 0 0 2px var(--ink), 0 0 0 4px #fff; }
  .detail-acc{ border-top:1px solid var(--line); }
  .detail-acc summary{ padding:14px 0; cursor:pointer;
    font-size:13px; list-style:none; display:flex;
    justify-content:space-between; align-items:center; }
  .detail-acc summary::-webkit-details-marker{ display:none; }
  .detail-acc summary::after{ content:'+'; font-size:18px; }
  .detail-acc[open] summary::after{ content:'−'; }
  .detail-acc .acc-body{ padding:0 0 16px; color:var(--muted); font-size:13px; }

  /* ============ HOME HERO ============ */
  .hero{ position:relative; height:560px; }
  @media (min-width:768px){ .hero{ height:650px; } }
  .hero img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .hero-content{ position:relative; height:100%;
    display:flex; align-items:center; color:#fff; }
  .hero-text{ max-width:520px; text-shadow:0 2px 12px rgba(0,0,0,0.35); }
  .hero-text h1{ margin:12px 0 20px; }

  .category-card{ position:relative; aspect-ratio:3/4;
    background:var(--soft); overflow:hidden; }
  .category-card img{ width:100%; height:100%; object-fit:cover;
    transition:transform 500ms ease; }
  .category-card:hover img{ transform:scale(1.05); }
  .category-card-label{ position:absolute; bottom:24px; left:24px;
    color:#fff; text-shadow:0 2px 8px rgba(0,0,0,0.4); }

  /* ============ NEWSLETTER ============ */
  .newsletter{ background:var(--soft); padding:64px 0; text-align:center; }
  .newsletter form{ max-width:440px; margin:0 auto;
    display:flex; gap:8px; flex-wrap:wrap; }
  .newsletter input{ flex:1; min-width:0; }

  /* ============ FOOTER ============ */
  .footer{ border-top:1px solid var(--line); margin-top:64px; }
  .footer-cols{ display:grid; grid-template-columns:repeat(2,1fr);
    gap:32px; padding:48px 0; }
  @media (min-width:768px){ .footer-cols{ grid-template-columns:repeat(4,1fr); } }
  .footer-col h4{ font-size:11px; letter-spacing:0.15em;
    text-transform:uppercase; margin-bottom:16px; }
  .footer-col ul li{ margin-bottom:8px; }
  .footer-col a{ color:var(--muted); font-size:13px; }
  .footer-col a:hover{ color:var(--ink); }
  .footer-bottom{ border-top:1px solid var(--line);
    padding:20px 0; display:flex; flex-direction:column;
    align-items:center; gap:12px; font-size:12px; color:var(--muted); }
  @media (min-width:768px){ .footer-bottom{ flex-direction:row;
    justify-content:space-between; } }

  /* ============ PAGE ============ */
  .page{ padding:32px 0; }
  .breadcrumb{ font-size:12px; color:var(--muted);
    margin-bottom:16px; }
  .breadcrumb a:hover{ color:var(--ink); }
  .page-h1{ font-size:28px; margin-bottom:8px; }
  @media (min-width:768px){ .page-h1{ font-size:36px; } }

  .toolbar{ display:flex; flex-direction:column; gap:12px;
    padding:16px 0; border-bottom:1px solid var(--line);
    margin-bottom:24px; }
  @media (min-width:768px){ .toolbar{ flex-direction:row;
    justify-content:space-between; align-items:center; } }
  .filter-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ padding:6px 14px; font-size:12px; border:1px solid var(--line);
    cursor:pointer; transition:all 150ms; background:#fff; }
  .chip:hover{ border-color:var(--ink); }
  .chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  /* ============ EMPTY STATE ============ */
  .empty{ padding:64px 24px; text-align:center; color:var(--muted); }
  .empty h3{ color:var(--ink); margin-bottom:12px; font-size:18px; }

  /* ============ ADMIN ============ */
  .admin-layout{ display:grid; grid-template-columns:1fr; min-height:100vh; }
  @media (min-width:768px){ .admin-layout{ grid-template-columns:220px 1fr; } }
  .admin-side{ border-right:1px solid var(--line); padding:16px; }
  .admin-side a{ display:block; padding:8px 12px; font-size:13px;
    color:var(--muted); transition:background 150ms; }
  .admin-side a:hover{ background:var(--soft); color:var(--ink); }
  .admin-side a.active{ background:var(--soft); color:var(--ink); font-weight:500; }
  .admin-main{ padding:24px 16px; }
  .admin-cards{ display:grid; grid-template-columns:repeat(2,1fr);
    gap:12px; margin-bottom:24px; }
  @media (min-width:768px){ .admin-cards{ grid-template-columns:repeat(3,1fr); } }
  .admin-card{ border:1px solid var(--line); padding:16px; }
  .admin-card .k{ font-size:10px; text-transform:uppercase;
    letter-spacing:0.15em; color:var(--muted); margin-bottom:6px; }
  .admin-card .v{ font-size:24px; font-weight:500; }
  .admin-table{ font-size:13px; }
  .admin-table th, .admin-table td{ padding:10px 8px; text-align:left;
    border-bottom:1px solid var(--line); }
  .admin-table th{ font-size:10px; text-transform:uppercase;
    letter-spacing:0.1em; color:var(--muted); font-weight:500; }

  /* ============ TOAST ============ */
  .toast-wrap{ position:fixed; bottom:24px; right:24px; z-index:100;
    display:flex; flex-direction:column; gap:8px; }
  .toast{ background:var(--ink); color:#fff; padding:12px 20px;
    font-size:13px; min-width:220px; box-shadow:0 4px 20px rgba(0,0,0,0.2);
    animation:slideIn 250ms ease; }
  .toast.error{ background:var(--danger); }
  .toast.success{ background:var(--success); }
  @keyframes slideIn{ from{ transform:translateX(100%); opacity:0; }
    to{ transform:translateX(0); opacity:1; } }

  /* ============ CHECKOUT ============ */
  .checkout-layout{ display:grid; grid-template-columns:1fr; gap:32px; }
  @media (min-width:1024px){ .checkout-layout{ grid-template-columns:1fr 380px; } }
  .checkout-section{ margin-bottom:28px; }
  .checkout-section h2{ font-size:12px; letter-spacing:0.15em;
    text-transform:uppercase; margin-bottom:12px; }
  .checkout-summary{ border:1px solid var(--line); padding:20px;
    height:fit-content; position:sticky; top:80px; }

  .qty-ctrl{ display:inline-flex; align-items:center; border:1px solid var(--line); }
  .qty-ctrl button{ width:30px; height:30px; font-size:14px; }
  .qty-ctrl span{ width:30px; text-align:center; font-size:12px; }

  /* ============ A11Y ============ */
  .sr-only{ position:absolute; width:1px; height:1px; padding:0;
    margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0; }
  :focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important;
       transition-duration:0.01ms !important; }
  }

  /* Utility */
  .hidden{ display:none !important; }
  .mt-2{ margin-top:8px; } .mt-4{ margin-top:16px; } .mt-6{ margin-top:24px; }
  .mb-2{ margin-bottom:8px; } .mb-4{ margin-bottom:16px; } .mb-6{ margin-bottom:24px; }
  .py-8{ padding:32px 0; } .py-12{ padding:48px 0; } .py-16{ padding:64px 0; }
</style>
</head>
<body>

<div id="root"></div>
<div id="overlays"></div>
<aside id="cartDrawer" class="cart-drawer" aria-label="Shopping bag"></aside>
<aside id="mobileMenu" class="drawer-left" aria-label="Menu"></aside>
<div id="toastWrap" class="toast-wrap"></div>

<script>
(function(){
  'use strict';

  /* ==================== UTILS ==================== */
  const $  = (sel, el=document) => el.querySelector(sel);
  const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));
  const fmt = n => '₹' + Number(n).toLocaleString('en-IN');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const slugify = s => String(s).toLowerCase().trim()
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const uid = () => Math.random().toString(36).slice(2,10);
  const orderNo = () => 'VLR' + Date.now().toString(36).toUpperCase().slice(-6) + uid().slice(0,4).toUpperCase();
  const today = () => new Date().toISOString();

  function toast(msg, type){
    const wrap = document.getElementById('toastWrap');
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 200ms'; }, 2600);
    setTimeout(() => el.remove(), 2900);
  }

  function imgTag(src, alt, extra){
    return '<img src="' + esc(src) + '" alt="' + esc(alt||'') + '" loading="lazy" onerror="window.__imgErr(this)" ' + (extra||'') + '>';
  }

  /* ==================== STORAGE ==================== */
  const DB = {
    get(k, def){
      try { const v = localStorage.getItem('velora_' + k);
        return v ? JSON.parse(v) : def; } catch(e){ return def; }
    },
    set(k, v){
      try { localStorage.setItem('velora_' + k, JSON.stringify(v)); } catch(e){}
    },
    remove(k){ try { localStorage.removeItem('velora_' + k); } catch(e){} }
  };

  /* ==================== CATEGORIES ==================== */
  const CATEGORIES = {
    women: { name:'Women',

  function buildProduct(catKey, seed, idx){
    const [name, subcat, price, salePrice] = seed;
    const slug = slugify(name) + '-' + catKey.slice(0,1) + idx;
    const isKid = catKey === 'kids';
    const sizes = isKid ? KID_SIZES : ADULT_SIZES;
    const colorsUsed = COLOR_SET.slice(0, 3);
    const variants = [];
    colorsUsed.forEach(c => {
      sizes.forEach(s => {
        variants.push({
          key: slug + '-' + slugify(c.color) + '-' + s,
          size: s,
          color: c.color,
          colorHex: c.hex,
          stock: 3 + Math.floor(Math.random() * 18)
        });
      });
    });
    const seedBase = 'velora-' + slug;
    const images = [
      'https://picsum.photos/seed/' + seedBase + 'a/600/800',
      'https://picsum.photos/seed/' + seedBase + 'b/600/800',
      'https://picsum.photos/seed/' + seedBase + 'c/600/800'
    ];
    return {
      id: slug,
      sku: 'VEL-' + slug.toUpperCase().slice(0,6) + '-' + idx,
      name,
      slug,
      subcat,
      category: catKey,
      price: price * 100,
      salePrice: salePrice ? salePrice * 100 : null,

  function addToCart(variantKey, qty){
    qty = qty || 1;
    const products = getProducts();
    let product = null, variant = null;
    for (const p of products){
      const v = p.variants.find(x => x.key === variantKey);
      if (v){ product = p; variant = v; break; }
    }
    if (!product || !variant) return toast('Product not found', 'error');
    if (variant.stock < qty) return toast('Not enough stock', 'error');

    const cart = getCart();
    const existing = cart.find(i => i.variantKey === variantKey);
    if (existing){
      existing.qty = Math.min(variant.stock, existing.qty + qty);
    } else {
      cart.push({ productId: product.id, variantKey, qty });
    }
    saveCart(cart);
    updateHeaderCounts();
    renderCartDrawer();
    openCart();
    toast('Added to bag');
  }
  function updateQty(variantKey, qty){
    const cart = getCart();
    const item = cart.find(i => i.variantKey === variantKey);
    if (!item) return;
    const products = getProducts();
    let maxStock = 99;
    for (const p of products){
      const v = p.variants.find(x => x.key === variantKey);
      if (v){ maxStock = v.stock; break; }
    }
    item.qty = Math.max(1, Math.min(maxStock, qty));
    saveCart(cart);
    updateHeaderCounts();
    renderCartDrawer();
    if (location.hash.startsWith('#/cart')) render();
  }
  function removeFromCart(variantKey){
    const cart = getCart().filter(i => i.variantKey !== variantKey);
    saveCart(cart);
    updateHeaderCounts();
    renderCartDrawer();
    if (location.hash.startsWith('#/cart')) render();
  }
  function clearCart(){ saveCart([]); updateHeaderCounts(); renderCartDrawer(); }

  function cartDetailed(){
    const products = getProducts();
    const items = getCart().map(i => {
      const p = products.find(x => x.id === i.productId);
      if (!p) return null;
      const v = p.variants.find(x => x.key === i.variantKey);
      if (!v) return null;
      const unit = p.salePrice || p.price;
      return {
        product: p, variant: v, qty: i.qty,
        unitPrice: unit,
        lineTotal: unit * i.qty
      };
    }).filter(Boolean);
    const subtotal = items.reduce((s,i) => s + i.lineTotal, 0);
    const count = items.reduce((s,i) => s + i.qty, 0);
    const shipping = subtotal === 0 ? 0 : (subtotal >= 149900 ? 0 : 4900);
    return { items, subtotal, count, shipping, total: subtotal + shipping };
  }

      ];
      DB.set('coupons', c);
    }
    return c;
  }
  function saveCoupons(list){ DB.set('coupons', list); }

  function validateCoupon(code, subtotal){
    if (!code) return { ok:false, error:'Enter a code' };
    const c = getCoupons().find(x => x.code.toUpperCase() === code.toUpperCase() && x.active);
    if (!c) return { ok:false, error:'Invalid coupon' };
    if (c.usageLimit != null && c.usedCount >= c.usageLimit) return { ok:false, error:'Coupon limit reached' };
    if (subtotal < c.minOrder) return { ok:false, error:'Minimum order ' + fmt(c.minOrder / 100) };
    let discount = 0;
    if (c.type === 'PERCENTAGE'){
      discount = Math.round(subtotal * c.value / 100);
      if (c.maxDiscount) discount = Math.min(discount, c.maxDiscount);
    } else {
      discount = c.value;
    }
    return { ok:true, coupon:c, discount };
  }

  /* ==================== ORDERS ==================== */
  function getOrders(){ const o = DB.get('orders', []); return Array.isArray(o) ? o : []; }
  function saveOrders(list){ DB.set('orders', list); }

  function placeOrder(payload){
    const cart = cartDetailed();
    if (cart.items.length === 0) return { ok:false, error:'Cart is empty' };

    // Re-validate stock
    for (const it of cart.items){
      if (it.variant.stock < it.qty) return { ok:false, error:'Not enough stock: ' + it.product.name };
    }

    let discount = 0;
    let appliedCoupon = null;
    if (payload.couponCode){
      const v = validateCoupon(payload.couponCode, cart.subtotal);
      if (!v.ok) return { ok:false, error: v.error };
      discount = v.discount;
      appliedCoupon = v.coupon;
    }
    const total = cart.subtotal - discount + cart.shipping;

    const order = {
      id: uid(),
      orderNumber: orderNo(),
      userId: getSession() ? getSession().id : null,
      email: payload.email,
      phone: payload.phone,
      shipping: payload.address,
      items: cart.items.map(i => ({
        productId: i.product.id,
        variantKey: i.variant.key,
        name: i.product.name,
        image: i.product.images[0],
        size: i.variant.size,
        color: i.variant.color,
        unitPrice: i.unitPrice,
        qty: i.qty,
        lineTotal: i.lineTotal
      })),
      subtotal: cart.subtotal,
      discount,
      shippingCost: cart.shipping,
      total,
      couponCode: appliedCoupon ? appliedCoupon.code : null,
      paymentMethod: payload.paymentMethod,
      paymentStatus: payload.paymentMethod === 'COD' ? 'PENDING' : 'PAID',
      status: 'CONFIRMED',
      createdAt: today()
    };

    // Decrement stock
    const products = getProducts();
    for (const it of cart.items){
      for (const p of products){
        const v = p.variants.find(x => x.key === it.variant.key);
        if (v){ v.stock = Math.max(0, v.stock - it.qty); }
      }
    }
    saveProducts(products);

    if (appliedCoupon){
      const coupons = getCoupons();
      const c = coupons.find(x => x.code === appliedCoupon.code);
      if (c) c.usedCount = (c.usedCount || 0) + 1;
      saveCoupons(coupons);
    }

    const orders = getOrders();
    orders.unshift(order);
    saveOrders(orders);
    clearCart();
    return { ok:true, order };
  }

  function parseRoute(){
    const raw = location.hash.slice(1) || '/';

    return { segments, query, raw };

  function openSearch(){

    overlay.innerHTML = `
      <div class="search-panel">
        <div class="container" style="max-width:720px">
          <div class="flex justify-between items-center mb-4">

          </div>
          <div id="searchResults" class="mt-4" style="max-height:60vh;overflow-y:auto"></div>
        </div>
      </div>
    `;
    document.getElementById('overlays').appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeSearch(); });

    const input = $('#searchInput');
    let timer = null;
    input.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => renderSearchResults(input.value), 200);
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter'){
        closeSearch();
        navigate('/search?q=' + encodeURIComponent(input.value));
      }
    });
    setTimeout(() => input.focus(), 50);
  }
  function closeSearch(){
    const el = document.getElementById('searchOverlay');
    if (el) el.remove();
  }
  function renderSearchResults(q){
    const box = document.getElementById('searchResults');
    if (!box) return;
    if (!q || q.length < 2){
      box.innerHTML = '<p class="text-sm text-muted">Start typing to search…</p>';
      return;
    }
    const results = searchProducts(q).slice(0, 8);
    if (!results.length){
      box.innerHTML = '<p class="text-sm text-muted">No results for "' + esc(q) + '".</p>';
      return;

    box.innerHTML = `
      <ul style="border-top:1px solid var(--line)">

  /* ==================== PAGE: LISTING ==================== */
  function pageListing(segments, query){
    let products = getProducts();
    let title = '', desc = '', breadcrumb = '';
    const cat = segments[0];
    const sub = segments[1];

    if (cat === 'new-in'){
      products = products.filter(p => p.isNew);
      title = 'New In';
      desc = 'The latest arrivals, added weekly.';
      breadcrumb = 'New In';
    } else if (cat === 'sale'){
      products = products.filter(p => p.salePrice);
      title = 'Sale';
      desc = 'Last chance — markdowns across the collection.';
      breadcrumb = 'Sale';
    } else if (cat === 'trending'){
      products = products.filter(p => p.isBestSeller);
      title = 'Trending Now';
      desc = 'What everyone is wearing.';
      breadcrumb = 'Trending';
    } else if (CATEGORIES[cat]){
      products = products.filter(p => p.category === cat);
      if (sub){
        products = products.filter(p => slugify(p.subcat) === sub);
        const subName = CATEGORIES[cat].subs.find(s => slugify(s) === sub) || sub;
        title = subName;
        desc = 'Explore ' + subName.toLowerCase() + ' in the ' + CATEGORIES[cat].name + ' collection.';
        breadcrumb = `<a href="#/${cat}">${CATEGORIES[cat].name}</a> / <span>${esc(subName)}</span>`;
      } else {
        title = CATEGORIES[cat].name;
        desc = 'Explore the full ' + CATEGORIES[cat].name.toLowerCase() + ' collection.';
        breadcrumb = `<span>${CATEGORIES[cat].name}</span>`;
      }
    } else {
      return pageNotFound();
    }

    // Apply filters
    if (query.size){
      products = products.filter(p => p.variants.some(v => v.size === query.size && v.stock > 0));
    }
    if (query.color){
      products = products.filter(p => p.variants.some(v => v.color === query.color && v.stock > 0));
    }
    if (query.max){
      const max = parseInt(query.max);
      if (max) products = products.filter(p => (p.salePrice || p.price) / 100 <= max);
    }
    if (query.availability === 'in'){
      products = products.filter(p => p.variants.some(v => v.stock > 0));
    }

    // Sort
    const sort = query.sort || 'recommended';
    if (sort === 'newest'){
      products = [...products].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    } else if (sort === 'price-asc'){
      products = [...products].sort((a,b) => (a.salePrice || a.price) - (b.salePrice || b.price));
    } else if (sort === 'price-desc'){
      products = [...products].sort((a,b) => (b.salePrice || b.price) - (a.salePrice || a.price));
    } else if (sort === 'best'){
      products = [...products].sort((a,b) => Number(b.isBestSeller) - Number(a.isBestSeller));
    }

    const base = '#/' + segments.join('/');
    const sorts = [
      ['recommended','Recommended'], ['newest','Newest'],
      ['price-asc','Price: Low → High'], ['price-desc','Price: High → Low'],
      ['best','Best Sellers']
    ];
    const sizes = ['XS','S','M','L','XL','2Y','4Y','6Y','8Y','10Y'];
    const colors = COLOR_SET.map(c => c.color);

    return `
      <div class="container page">
        <div class="breadcrumb"><a href="#/">Home</a> / ${breadcrumb}</div>
        <h1 class="page-h1">${esc(title)}</h1>
        <p class="text-sm text-muted mb-6">${esc(desc)}</p>

        <div class="toolbar">
          <div class="filter-chips">
            ${sorts.map(([v,l]) => `<a href="${base}?${qs({...query, sort: v})}" class="chip ${sort === v ? 'active' : ''}">${l}</a>`).join('')}
          </div>
          <p class="text-sm text-muted">${products.length} products</p>
        </div>

        <div class="filter-chips" style="margin-bottom:24px">
          <span class="text-xs text-muted uppercase tracking-widest" style="padding:6px 0; margin-right:8px">Filter:</span>
          ${sizes.map(s => `<a href="${base}?${qs({...query, size: query.size === s ? '' : s})}" class="chip ${query.size === s ? 'active' : ''}">${s}</a>`).join('')}
          ${colors.map(c => `<a href="${base}?${qs({...query, color: query.color === c ? '' : c})}" class="chip ${query.color === c ? 'active' : ''}">${c}</a>`).join('')}
          <a href="${base}?${qs({...query, availability: query.availability === 'in' ? '' : 'in'})}" class="chip ${query.availability === 'in' ? 'active' : ''}">In Stock</a>
          ${(query.size || query.color || query.availability) ? `<a href="${base}?sort=${sort}" class="chip" style="border-color:var(--sale);color:var(--sale)">Clear filters</a>` : ''}
        </div>

        ${productGrid(products)}
      </div>
    `;
  }

  function qs(obj){
    return Object.entries(obj).filter(([k,v]) => v).map(([k,v]) => k + '=' + encodeURIComponent(v)).join('&');
  }

  /* ==================== ROUTER ==================== */
  function render(){
    const route = parseRoute();
    const seg = route.segments;
    const q = route.query;
    let pageHTML = '';
    let headerNav = '';

    // Route dispatch
    if (seg.length === 0) pageHTML = pageHome();
    else if (seg[0] === 'product' && seg[1]) pageHTML = pageProduct(seg[1]);
    else if (seg[0] === 'search') pageHTML = pageSearch(q);
    else if (seg[0] === 'cart') pageHTML = pageCart();
    else if (seg[0] === 'checkout' && seg[1] === 'success') pageHTML = pageSuccess(q);
    else if (seg[0] === 'checkout' && seg[1] === 'failure') pageHTML = pageFailure(q);
    else if (seg[0] === 'checkout') pageHTML = pageCheckout();
    else if (seg[0] === 'login') pageHTML = pageLogin();
    else if (seg[0] === 'register') pageHTML = pageRegister();
    else if (seg[0] === 'forgot-password') pageHTML = pageForgot();
    else if (seg[0] === 'account'){
      if (seg[1] === 'orders' && seg[2]) pageHTML = pageOrderDetail(seg[2]);
      else if (seg[1] === 'orders') pageHTML = pageAccountOrders();
      else if (seg[1] === 'wishlist') pageHTML = pageWishlist();
      else if (seg[1] === 'addresses') pageHTML = pageAddresses();
      else if (seg[1] === 'profile') pageHTML = pageProfile();
      else pageHTML = pageAccount();
    }
    else if (seg[0] === 'admin'){
      if (seg[1] === 'products' && seg[2] === 'new') pageHTML = pageAdminProductForm();
      else if (seg[1] === 'products' && seg[2]) pageHTML = pageAdminProductForm(seg[2]);
      else if (seg[1] === 'products') pageHTML = pageAdminProducts();
      else if (seg[1] === 'orders' && seg[2]) pageHTML = pageAdminOrderDetail(seg[2]);
      else if (seg[1] === 'orders') pageHTML = pageAdminOrders();
      else if (seg[1] === 'inventory') pageHTML = pageAdminInventory();
      else if (seg[1] === 'customers') pageHTML = pageAdminCustomers();
      else if (seg[1] === 'coupons') pageHTML = pageAdminCoupons();
      else if (seg[1] === 'newsletter') pageHTML = pageAdminNewsletter();
      else pageHTML = pageAdmin();
    }
    else if (seg[0] === 'about') pageHTML = pageAbout();
    else if (seg[0] === 'contact') pageHTML = pageContact();
    else if (seg[0] === 'faq') pageHTML = pageFAQ();
    else if (seg[0] === 'shipping') pageHTML = pageStaticPage('Shipping Policy', '<p>Free shipping on all orders above ₹1,499. Orders below this amount are charged a flat ₹49 shipping fee.</p><p class="mt-4">Standard delivery takes 3–6 business days across India. Metro cities often receive orders faster. You\'ll receive a tracking link as soon as your order ships.</p>');
    else if (seg[0] === 'returns') pageHTML = pageStaticPage('Returns & Refunds', '<p>We accept returns within 14 days of delivery for unworn items with tags attached. To start a return, contact us at support@velora.in.</p><p class="mt-4">Refunds are processed to the original payment method within 5–7 business days after the return is received and inspected.</p>');
    else if (seg[0] === 'privacy') pageHTML = pageStaticPage('Privacy Policy', '<p>We collect only the information needed to process your orders and improve our store. This includes your contact details, shipping address, and order history.</p><p class="mt-4">We never sell your data. Payments are processed securely by Razorpay; we do not store card details. Passwords are stored using industry-standard hashing.</p>');
    else if (seg[0] === 'terms') pageHTML = pageStaticPage('Terms & Conditions', '<p>By using VELORA you agree to our terms of sale, delivery, returns, and privacy policies. All prices are in Indian Rupees (INR) and inclusive of applicable taxes.</p>');
    else if (seg[0] === 'cookies') pageHTML = pageStaticPage('Cookie Policy', '<p>We use cookies to keep you signed in, remember your cart, and analyse store performance. You can control cookies from your browser settings.</p>');
    else if (seg[0] === 'journal') pageHTML = pageJournal();
    else if (['women','men','kids','new-in','sale','trending'].includes(seg[0])) pageHTML = pageListing(seg, q);
    else pageHTML = pageNotFound();

    // Admin layout has its own wrapper
    const isAdmin = seg[0] === 'admin';
    const root = document.getElementById('root');
    root.innerHTML = `
      ${isAdmin ? '' : renderHeader()}
      ${pageHTML}
      ${isAdmin ? '' : renderFooter()}
    `;
    window.scrollTo(0, 0);
    renderCartDrawer();
    renderMobileMenu();
    updateHeaderCounts();
  }

  function updateHeaderCounts(){
    // Re-render only the counts in header by re-rendering whole header is simplest
    if (location.hash.startsWith('#/admin')) return;
    const header = document.querySelector('.header');
    if (!header) return;
    const cart = cartDetailed();
    const wishlist = getWishlist();
    // Update cart count
    const cartBtn = header.querySelector('[data-action="open-cart"]');
    if (cartBtn){
      const existing = cartBtn.querySelector('.cart-count');
      if (cart.count > 0){
        if (existing) existing.textContent = cart.count;
        else {
          const s = document.createElement('span');
          s.className = 'cart-count';
          s.textContent = cart.count;
          cartBtn.appendChild(s);
        }
      } else if (existing) existing.remove();
    }
    const wishBtn = header.querySelector('[data-desktop-wishlist]');
    if (wishBtn){
      const existing = wishBtn.querySelector('.cart-count');
      if (wishlist.length > 0){
        if (existing) existing.textContent = wishlist.length;
        else {
          const s = document.createElement('span');
          s.className = 'cart-count';
          s.textContent = wishlist.length;
          wishBtn.appendChild(s);
        }
      } else if (existing) existing.remove();
    }
  }

  /* ==================== EVENT HANDLING ==================== */

  // Click delegation
  document.addEventListener('click', function(e){
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;

    // Don't follow links for wishlist buttons
    if (action === 'wishlist'){
      e.preventDefault();
      e.stopPropagation();
      toggleWishlist(el.dataset.id);
      return;
    }

    switch (action){
      case 'nav':
        // Let anchor navigate naturally
        if (el.tagName === 'A') return;
        e.preventDefault();
        if (el.dataset.href) navigate(el.dataset.href);
        break;

      case 'open-cart': e.preventDefault(); renderCartDrawer(); openCart(); break;
      case 'close-cart': e.preventDefault(); closeCart(); break;
      case 'open-menu': e.preventDefault(); renderMobileMenu(); openMenu(); break;
      case 'close-menu': e.preventDefault(); closeMenu(); break;
      case 'open-search': e.preventDefault(); openSearch(); break;
      case 'close-search': e.preventDefault(); closeSearch(); if (el.tagName === 'A') return; break;

      case 'qty-up': {
        e.preventDefault();
        const key = el.dataset.key;
        const cart = getCart();
        const item = cart.find(i => i.variantKey === key);
        if (item) updateQty(key, item.qty + 1);
        break;
      }
      case 'qty-down': {
        e.preventDefault();
        const key = el.dataset.key;
        const cart = getCart();
        const item = cart.find(i => i.variantKey === key);
        if (item) updateQty(key, item.qty - 1);
        break;
      }
      case 'remove-cart': e.preventDefault(); removeFromCart(el.dataset.key); break;
      case 'logout': e.preventDefault(); handleLogout(); break;

      case 'select-color': {
        e.preventDefault();
        const color = el.dataset.color;
        $$('.color-btn').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        const selectedLabel = document.getElementById('selectedColor');
        if (selectedLabel) selectedLabel.textContent = color;
        // Update sizes
        const product = findProductFromPage();
        if (product){
          const sizeList = document.getElementById('sizeList');
          if (sizeList){
            const sizes = Array.from(new Set(product.variants.map(v => v.size)));
            sizeList.innerHTML = sizes.map(s => {
              const v = product.variants.find(x => x.size === s && x.color === color);
              const available = v && v.stock > 0;
              return `<button class="size-btn" data-action="select-size" data-size="${esc(s)}" ${!available ? 'disabled' : ''}>${esc(s)}</button>`;
            }).join('');
          }
        }
        // Clear stock msg
        const msg = document.getElementById('stockMsg');
        if (msg) msg.textContent = '';
        break;
      }
      case 'select-size': {
        e.preventDefault();
        if (el.disabled) return;
        $$('.size-btn').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        // Show stock
        const size = el.dataset.size;
        const colorLabel = document.getElementById('selectedColor');
        const color = colorLabel ? colorLabel.textContent : '';
        const product = findProductFromPage();
        if (product){
          const v = product.variants.find(x => x.size === size && x.color === color);
          const msg = document.getElementById('stockMsg');
          if (msg) msg.textContent = v && v.stock < 5 && v.stock > 0 ? 'Only ' + v.stock + ' left in this size' : '';
        }
        break;
      }
      case 'add-cart': {
        e.preventDefault();
        const slug = el.dataset.slug;
        const product = findProduct(slug);
        if (!product) return toast('Product not found', 'error');
        const sizeEl = document.querySelector('.size-btn.selected');
        if (!sizeEl){ return toast('Please select a size', 'error'); }
        const colorLabel = document.getElementById('selectedColor');
        const color = colorLabel ? colorLabel.textContent : '';
        const size = sizeEl.dataset.size;
        const variant = product.variants.find(v => v.size === size && v.color === color);
        if (!variant){ return toast('Selected combination unavailable', 'error'); }
        addToCart(variant.key, 1);
        break;
      }
      case 'gallery-thumb': {
        e.preventDefault();
        const src = el.dataset.src;
        const main = document.getElementById('mainImage');
        if (main) main.src = src;
        $$('.pdp-thumb').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        break;
      }
      case 'size-guide':
        e.preventDefault();
        alert('Size Guide:\n\nXS = 32"\nS = 34"\nM = 36"\nL = 38"\nXL = 40"\n\nMeasurements are garment chest measurements.');
        break;
      case 'apply-coupon': {
        e.preventDefault();
        const form = el.closest('form');
        const code = form.couponCode.value.trim();
        if (!code) return toast('Enter a coupon code', 'error');
        const cart = cartDetailed();
        const result = validateCoupon(code, cart.subtotal);
        const msg = document.getElementById('couponMsg');
        if (!result.ok){
          if (msg){ msg.textContent = result.error; msg.style.color = 'var(--danger)'; }
          return toast(result.error, 'error');
        }
        if (msg){ msg.textContent = 'Coupon applied — saved ' + fmt(result.discount / 100); msg.style.color = 'var(--success)'; }
        window.__appliedCoupon = result.coupon.code;
        // Update totals
        const discRow = document.getElementById('discountRow');
        const discVal = document.getElementById('discountValue');
        const totalVal = document.getElementById('totalValue');
        const orderTotal = document.getElementById('orderTotal');
        if (discRow){ discRow.style.display = 'flex'; discVal.textContent = '−' + fmt(result.discount / 100); }
        const newTotal = cart.subtotal - result.discount + cart.shipping;
        if (totalVal) totalVal.textContent = fmt(newTotal / 100);
        if (orderTotal) orderTotal.textContent = fmt(newTotal / 100);
        toast('Coupon applied');
        break;
      }
      case 'admin-delete-product': {
        e.preventDefault();
        if (!confirm('Delete this product?')) return;
        const id = el.dataset.id;
        const products = getProducts().filter(p => p.id !== id);
        saveProducts(products);
        toast('Product deleted');
        navigate('/admin/products');
        break;
      }
      case 'admin-toggle-coupon': {
        e.preventDefault();
        const code = el.dataset.code;
        const coupons = getCoupons();
        const c = coupons.find(x => x.code === code);
        if (c){ c.active = !c.active; saveCoupons(coupons); render(); }
        break;
      }
      case 'pick-address': {
        // Handled in change event below
        break;
      }
    }
  });

  // Change event for saved address picking
  document.addEventListener('change', function(e){
    if (e.target.name === 'savedAddr'){
      const addrs = getAddresses();
      const idx = parseInt(e.target.value);
      const a = addrs[idx];
      if (a){
        const form = e.target.closest('form');
        form.fullName.value = a.fullName;
        form.phone.value = a.phone;
        form.line1.value = a.line1;
        form.line2.value = a.line2 || '';
        form.city.value = a.city;
        form.state.value = a.state;
        form.pincode.value = a.pincode;
      }
    }
  });

  // Form submit delegation
  document.addEventListener('submit', function(e){
    const form = e.target.closest('form[data-action]');
    if (!form) return;
    e.preventDefault();
    const action = form.dataset.action;

    switch (action){
      case 'register': handleRegister(form); break;
      case 'login': handleLogin(form); break;
      case 'forgot': {
        const email = form.email.value.trim();
        if (!email) return toast('Enter your email', 'error');
        toast('Demo: password reset requires a backend email service');
        break;
      }
      case 'newsletter': {
        const email = form.email.value.trim();
        if (!/^\S+@\S+\.\S+$/.test(email)) return toast('Enter a valid email', 'error');
        const subs = DB.get('newsletter', []);
        if (subs.some(s => s.email === email)) return toast('You\'re already subscribed');
        subs.push({ email, createdAt: today() });
        DB.set('newsletter', subs);
        form.reset();
        toast('Subscribed!');
        break;
      }
      case 'contact': {
        toast('Message sent! We\'ll get back to you shortly.');
        form.reset();
        break;
      }
      case 'save-profile': {
        const user = getSession();
        if (!user) return;
        const users = getUsers();
        const u = users.find(x => x.id === user.id);
        u.name = form.name.value.trim();
        if (form.newPassword.value){
          if (form.newPassword.value.length < 6) return toast('Password must be 6+ characters', 'error');
          u.password = form.newPassword.value;
        }
        saveUsers(users);
        toast('Profile updated');
        render();
        break;
      }
      case 'add-address': {
        saveAddress({
          fullName: form.fullName.value.trim(),
          phone: form.phone.value.trim(),
          line1: form.line1.value.trim(),
          line2: form.line2.value.trim(),
          city: form.city.value.trim(),
          state: form.state.value.trim(),
          pincode: form.pincode.value.trim()
        });
        render();
        break;
      }
      case 'checkout': {
        const data = {
          email: form.email.value.trim(),
          phone: form.phone.value.trim(),
          address: {
            fullName: form.fullName.value.trim(),
            line1: form.line1.value.trim(),
            line2: form.line2.value.trim(),
            city: form.city.value.trim(),
            state: form.state.value.trim(),
            pincode: form.pincode.value.trim(),
            country: 'India'
          },
          paymentMethod: (form.querySelector('input[name="paymentMethod"]:checked') || {}).value || 'COD',
          couponCode: window.__appliedCoupon || form.couponCode.value.trim() || null
        };

        if (!/^\S+@\S+\.\S+$/.test(data.email)) return toast('Enter a valid email', 'error');
        if (!/^\d{10,15}$/.test(data.phone)) return toast('Enter a valid phone number', 'error');
        if (!/^\d{6}$/.test(data.address.pincode)) return toast('Enter a valid 6-digit PIN code', 'error');

        const btn = form.querySelector('button.btn-primary');
        btn.disabled = true;
        btn.textContent = 'PROCESSING...';

        // Simulate payment processing
        setTimeout(() => {
          const result = placeOrder(data);
          window.__appliedCoupon = null;
          if (!result.ok){
            toast(result.error, 'error');
            btn.disabled = false;
            btn.textContent = 'PLACE ORDER';
            return;
          }
          toast('Order placed!');
          navigate('/checkout/success?order=' + encodeURIComponent(result.order.orderNumber));
        }, 800);
        break;
      }
      case 'admin-save-product': {
        if (!requireAdmin()) return;
        const id = form.dataset.id;
        const [cat, ...rest] = form.catSub.value.split('|');
        const subcat = rest.join('|');
        const products = getProducts();
        const pricePaise = Math.round(parseFloat(form.price.value) * 100);
        const salePricePaise = form.salePrice.value ? Math.round(parseFloat(form.salePrice.value) * 100) : null;
        if (salePricePaise && salePricePaise >= pricePaise) return toast('Sale price must be less than price', 'error');

        if (id){
          const p = products.find(x => x.id === id);
          if (!p) return toast('Product not found', 'error');
          p.name = form.name.value.trim();
          p.description = form.description.value.trim();
          p.category = cat;
          p.subcat = subcat;
          p.price = pricePaise;
          p.salePrice = salePricePaise;
          p.isNew = form.isNew.checked;
          p.isBestSeller = form.isBestSeller.checked;
          p.isFeatured = form.isFeatured.checked;
          p.status = form.status.value;
        } else {
          const slug = slugify(form.name.value) + '-' + uid();
          const isKid = cat === 'kids';
          const sizes = isKid ? KID_SIZES : ADULT_SIZES;
          const variants = [];
          COLOR_SET.slice(0, 3).forEach(c => {
            sizes.forEach(s => {
              variants.push({ key: slug + '-' + slugify(c.color) + '-' + s, size: s, color: c.color, colorHex: c.hex, stock: 10 });
            });
          });
          products.push({
            id: slug,
            sku: 'VEL-' + uid().toUpperCase(),
            name: form.name.value.trim(),
            slug,
            subcat,
            category: cat,
            price: pricePaise,
            salePrice: salePricePaise,
            description: form.description.value.trim(),
            material: 'Premium cotton blend',
            fit: 'Regular fit',
            care: 'Machine wash cold, do not bleach',
            brand: 'VELORA',
            images: [
              'https://picsum.photos/seed/' + slug + 'a/600/800',
              'https://picsum.photos/seed/' + slug + 'b/600/800',
              'https://picsum.photos/seed/' + slug + 'c/600/800'
            ],
            variants,
            isNew: form.isNew.checked,
            isBestSeller: form.isBestSeller.checked,
            isFeatured: form.isFeatured.checked,
            status: form.status.value,
            tags: [cat, slugify(subcat)],
            createdAt: today()
          });
        }
        saveProducts(products);
        toast('Product saved');
        navigate('/admin/products');
        break;
      }
      case 'admin-update-order': {
        if (!requireAdmin()) return;
        const id = form.dataset.id;
        const orders = getOrders();
        const o = orders.find(x => x.id === id);
        if (!o) return toast('Order not found', 'error');
        o.status = form.status.value;
        o.paymentStatus = form.paymentStatus.value;
        saveOrders(orders);
        toast('Order updated');
        break;
      }
      case 'admin-create-coupon': {
        if (!requireAdmin()) return;
        const code = form.code.value.trim().toUpperCase();
        if (!code) return toast('Enter a code', 'error');
        const coupons = getCoupons();
        if (coupons.some(c => c.code === code)) return toast('Code already exists', 'error');
        const type = form.type.value;
        const value = type === 'PERCENTAGE' ? parseInt(form.value.value) : Math.round(parseFloat(form.value.value) * 100);
        coupons.push({
          code, type, value,
          minOrder: Math.round(parseFloat(form.minOrder.value || 0) * 100),
          usageLimit: null, usedCount: 0, active: true
        });
        saveCoupons(coupons);
        toast('Coupon created');
        render();
        break;
      }
    }
  });

  // Helper to find product from current page
  function findProductFromPage(){
    const route = parseRoute();
    if (route.segments[0] === 'product' && route.segments[1]) return findProduct(route.segments[1]);
    return null;
  }

  // Overlay click to close
  document.getElementById('mobileMenu').addEventListener('click', e => {
    if (e.target === document.getElementById('mobileMenu')) closeMenu();
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){
      closeSearch();
      closeCart();
      closeMenu();
    }
  });

  // Route change
  window.addEventListener('hashchange', render);

  /* ==================== INIT ==================== */
  function init(){
    ensureAdmin();
    getProducts(); // seed products if needed
    getCoupons();  // seed coupons if needed
    render();
    // Clean up abandoned coupon if user navigates away from checkout (defensive)
    window.addEventListener('hashchange', () => {
      if (!location.hash.startsWith('#/checkout')) window.__appliedCoupon = null;
    });
  }

  init();
})();
</script>
</body>
</html>
